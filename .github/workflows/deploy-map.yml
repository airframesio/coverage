name: Deploy Map (Cloudflare Pages)

# Builds the map as a static export and publishes it to Cloudflare Pages.
#   - push to main            -> production deployment
#   - pull request (same repo) -> preview deployment
#   - manual run               -> deploys the selected ref
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   API token with "Account > Cloudflare Pages > Edit"
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID
# Optional repository variables:
#   CLOUDFLARE_PAGES_PROJECT      Pages project name (default: airframes-coverage)
#   NEXT_PUBLIC_COVERAGE_API_URL  Coverage API base URL
#   NEXT_PUBLIC_MAP_STYLE_URL     Default MapLibre style URL

on:
  push:
    branches: [main]
    paths:
      - map/**
      - .github/workflows/deploy-map.yml
  pull_request:
    branches: [main]
    paths:
      - map/**
      - .github/workflows/deploy-map.yml
  workflow_dispatch:

concurrency:
  group: deploy-map-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Fork and Dependabot pull requests do not receive secrets.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_COVERAGE_API_URL: ${{ vars.NEXT_PUBLIC_COVERAGE_API_URL || 'https://coverage-api.airframes.io' }}
      NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || 'wss://coverage-api.airframes.io/ws' }}
      NEXT_PUBLIC_MAP_STYLE_URL: ${{ vars.NEXT_PUBLIC_MAP_STYLE_URL || 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json' }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'airframes-coverage' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: map/.nvmrc
          cache: npm
          cache-dependency-path: map/package-lock.json

      - name: Install
        working-directory: map
        run: npm ci

      - name: Build static export
        working-directory: map
        run: npm run build:static

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping deploy."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.present == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: map
          command: >-
            pages deploy out
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
            --commit-dirty=true

      - name: Summary
        if: steps.creds.outputs.present == 'true'
        run: |
          echo "### Cloudflare Pages deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
